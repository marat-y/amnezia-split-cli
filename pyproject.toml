[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amnezia-cli"
version = "0.1.0"
description = "CLI для раздельного туннелирования AmneziaVPN на macOS"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
amnezia = "amnezia_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
